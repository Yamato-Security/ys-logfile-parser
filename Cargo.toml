[package]
name = "sootmark-ntfslog"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "NTFS transaction journal ($LogFile): restart areas, every log record with its redo and undo operations, and the file names and timestamps they carry."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/ntfslog"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response", "ntfs", "logfile"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "ntfslog"

[dependencies]
common = { package = "sootmark-common", version = "0.3.7" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"

# The test journal is 2 MiB once decompressed: an optimised inflater keeps
# the property tests short.
[profile.dev.package.sootmark-common]
opt-level = 3
